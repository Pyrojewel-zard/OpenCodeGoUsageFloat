name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Assemble and build
        shell: powershell
        run: .\build.ps1

      - name: SHA256
        shell: powershell
        run: Get-FileHash .\OpenCodeGoUsage.exe -Algorithm SHA256 | Format-List | Out-File SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenCodeGoUsageFloat-windows-x64
          path: |
            OpenCodeGoUsage.exe
            SHA256SUMS.txt
